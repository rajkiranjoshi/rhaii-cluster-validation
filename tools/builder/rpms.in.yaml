contentOrigin:
  repofiles:
    - ../../rpm-repos/redhat.repo
    - ../../rpm-repos/nvidia-cuda.repo

packages:
  # Builder stage (build dependencies for rdma-core, libfabric, fabtests, and perftest)
  - gcc
  - gcc-c++
  - make
  - diffutils
  - autoconf
  - automake
  - libtool
  - pkg-config
  - cmake
  - ninja-build
  - libnl3-devel
  - python3
  - pciutils-devel
  - cuda-nvml-devel-13-0

arches:
  - x86_64
  - aarch64

context:
  containerfile:
    file: ../Dockerfile.konflux
    stageName: builder
